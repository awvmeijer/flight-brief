# Saves NOAA GTG turbulence tiles (contiguous US, cruise levels) as release
# assets. NOMADS keeps two days of GTG files, so the forecast's track record
# starts when this job first runs on schedule. See docs/DESIGN.md, Phase 2.
#
# Scheduled workflows run from the default branch only, and GitHub disables
# them after 60 days without a commit; re-enable from the Actions tab.
name: gtg-tiles

on:
  schedule:
    # GTG runs are posted 53 to 88 minutes after run time. Each invocation
    # saves every 00/06/12/18Z run still missing, so a late start loses nothing.
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/flight_brief/forecast/**"
      - "src/flight_brief/jobs/gtg_tiles.py"
      - ".github/workflows/gtg-tiles.yml"

permissions:
  contents: read

concurrency:
  group: gtg-tiles-${{ github.event_name == 'pull_request' && github.ref || 'store' }}
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # release assets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Rehearsal on a pull request (one run, nothing published)
        if: github.event_name == 'pull_request'
        run: uv run python -u -m flight_brief.jobs.gtg_tiles --store "dir:$RUNNER_TEMP/tiles" --max-runs 1 --verify
      - name: Save tiles and read the newest one back
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -u -m flight_brief.jobs.gtg_tiles --store releases --verify
