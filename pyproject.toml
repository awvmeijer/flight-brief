[project]
name = "flight-brief"
version = "0.1.0"
description = "Flight weather brief with a public forecast track record"
requires-python = ">=3.11"
dependencies = [
    "eccodes>=2.38",
    "eccodeslib>=2.38",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
routes = ["timezonefinder>=6.5"]  # only to build the route table

[project.scripts]
brief = "flight_brief.cli:main"
brief-web = "flight_brief.web:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: fetches from NOAA; deselected by default"]
addopts = "-m 'not network'"
